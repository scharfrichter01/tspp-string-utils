variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 20
  GITLAB_TOKEN: $GIT_ACCESS_TOKEN
  DEBIAN_FRONTEND: noninteractive

before_script:
  - git config --global url."http://oauth2:${GITLAB_TOKEN}@vgit.mirea.ru/".insteadOf "http://vgit.mirea.ru/"

stages:
  - build
  - test
  - doxygen
  - pages

build:
  stage: build
  tags:
    - ubuntu
  script:
    - apt-get update -qq
    - apt-get install -y -qq cmake g++ make libgtest-dev
    # Собираем GoogleTest из исходников (для Ubuntu)
    - cd /usr/src/gtest
    - cmake .
    - make
    - cp lib/*.a /usr/lib/ || true
    - cd $CI_PROJECT_DIR
    - mkdir -p build && cd build
    - cmake ..
    - cmake --build .
  artifacts:
    paths:
      - build/string_utils_app
    expire_in: 1 hour

test:
  stage: test
  tags:
    - ubuntu
  script:
    - cd build
    - ctest --output-on-failure
  dependencies:
    - build

doxygen:
  stage: doxygen
  tags:
    - ubuntu
  script:
    - apt-get update -qq
    - apt-get install -y -qq doxygen graphviz
    - doxygen Doxyfile
  artifacts:
    paths:
      - doc/html
    expire_in: 1 week

pages:
  stage: pages
  tags:
    - ubuntu
  script:
    - mkdir -p public
    - cp -r doc/html/* public/
  artifacts:
    paths:
      - public
  dependencies:
    - doxygen
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH