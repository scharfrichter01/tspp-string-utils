stages:
  - build
  - unit-test
  - package
  - package-test
  - docs

variables:
  APP_NAME: string-utils
  DEB_PACKAGE_NAME: "$APP_NAME"
  DEB_PACKAGE_VER: "0.0.0"
  RPM_PACKAGE_NAME: "$APP_NAME"
  RPM_PACKAGE_VER: "0.0.0"

.build-template:
  stage: build
  script:
    - mkdir -p build
    - cd build
    - cmake .. -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON
    - make
  artifacts:
    untracked: false
    expire_in: 1 hour
    paths:
      - build/string_utils
      - build/string_utils_test
      - build/asan_test

.unit-test-template:
  stage: unit-test
  script:
    - ./build/string_utils_test --gtest_output=xml:report.xml
  artifacts:
    expire_in: 1 hour
    reports:
      junit: report.xml

.asan-test-template:
  stage: unit-test
  script:
    - ./build/asan_test --gtest_output=xml:asan_report.xml
    - |
      if [ -f asan_report.xml ]; then
        head -1 asan_report.xml > header.xml
        tail -n +2 asan_report.xml > body.xml
        {
          cat header.xml
          echo "<!-- Tested entities from string_utils.h: -->"
          grep -E '^[a-zA-Z_].+\(.*\);' ../include/string_utils.h | sed 's/^/    /' || echo "    (no functions found)"
          echo "-->"
          cat body.xml
        } > asan_report_new.xml
        mv asan_report_new.xml asan_report.xml
        rm -f header.xml body.xml
      else
        echo "WARNING: asan_report.xml not found, skipping annotation"
      fi
  artifacts:
    expire_in: 1 hour
    reports:
      junit: asan_report.xml

.package-test-template:
  stage: package-test
  script:
    - $INSTALL_CMD
    - $VERIFY_CMD
    - $LIST_FILES_CMD
    - string-utils trim "   hello world   "
    - string-utils trim hello world
    - string-utils split "a,b,c" ","
    - string-utils split "a, b, c" ", "
    - string-utils replace "this is a test" "is " "was "
    - string-utils replace this is a test is was
    - string-utils is_palindrome "A man a plan a canal panama"
    - string-utils are_anagrams "listen" "silent"
    - string-utils word_count "one two three four"

build-astra:
  extends: .build-template
  tags:
    - astra
  before_script:
    - apt-get update && apt-get install -y libgtest-dev cmake g++
    - cd /usr/src/gtest
    - cmake CMakeLists.txt
    - make
    - cp *.a /usr/lib/
    - cd -

build-redos:
  extends: .build-template
  tags:
    - redos
  before_script:
    - dnf install -y gtest-devel gmock-devel cmake gcc-c++

unit-test-astra:
  extends: .unit-test-template
  tags:
    - astra
  needs:
    - job: build-astra
      artifacts: true

unit-test-redos:
  extends: .unit-test-template
  tags:
    - redos
  needs:
    - job: build-redos
      artifacts: true

asan-test-astra:
  extends: .asan-test-template
  tags:
    - astra
  needs:
    - job: build-astra
      artifacts: true

asan-test-redos:
  extends: .asan-test-template
  tags:
    - redos
  needs:
    - job: build-redos
      artifacts: true

package-astra:
  stage: package
  tags:
    - astra
  needs:
    - job: build-astra
      artifacts: true
    - job: unit-test-astra
    - job: asan-test-astra
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        DEB_PACKAGE_VER: "$CI_COMMIT_TAG"
    - when: always
      variables:
        DEB_PACKAGE_VER: "0.0.0-$CI_COMMIT_SHORT_SHA"
  script:
    - mkdir -p "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER/DEBIAN"
    - mkdir -p "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER/usr/local/bin"
    - cp build/string_utils "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER/usr/local/bin/string-utils"
    - chmod 775 "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER/usr/local/bin/string-utils"
    - |
      cat > "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER/DEBIAN/control" << EOF
      Package: $DEB_PACKAGE_NAME
      Version: $DEB_PACKAGE_VER
      Section: utils
      Priority: optional
      Architecture: amd64
      Depends: libc6 (>= 2.24), libstdc++6 (>= 5.2)
      Maintainer: Dzhafarov Najmudin <dzhafarov.n.m@edu.mirea.ru>
      Description: cli string utils
       Package provides cli utlis: trim, split, replace, is_palindrome, are_anagrams, word_count.
      EOF
    - dpkg-deb --build "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER"
  artifacts:
    untracked: false
    expire_in: 1 hour
    name: "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER.deb"
    paths:
      - "$DEB_PACKAGE_NAME-$DEB_PACKAGE_VER.deb"

package-redos:
  stage: package
  tags:
    - redos
  needs:
    - job: build-redos
      artifacts: true
    - job: unit-test-redos
    - job: asan-test-redos
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        RPM_PACKAGE_VER: "$CI_COMMIT_TAG"
    - when: always
      variables:
        RPM_PACKAGE_VER: "0.0.0_$CI_COMMIT_SHORT_SHA"
  script:
    - mkdir -p rpmbuild/SPECS rpmbuild/SOURCES
    - cp build/string_utils rpmbuild/SOURCES/string-utils
    - chmod 775 "rpmbuild/SOURCES/string-utils"
    - |
      cat > rpmbuild/SPECS/$RPM_PACKAGE_NAME.spec << EOF
      Name: $RPM_PACKAGE_NAME
      Version: $RPM_PACKAGE_VER
      Release: 1%{?dist}
      Summary: CLI string utilities
      License: Unknown
      Source0: string-utils

      %description
      CLI string utilities.

      %install
      mkdir -p %{buildroot}%{_bindir}
      cp %{_sourcedir}/string-utils %{buildroot}%{_bindir}/%{name}

      %files
      %{_bindir}/%{name}
      EOF
    - rpmbuild -ba rpmbuild/SPECS/$RPM_PACKAGE_NAME.spec --define "_topdir $(pwd)/rpmbuild"
    - cp rpmbuild/RPMS/x86_64/$RPM_PACKAGE_NAME-$RPM_PACKAGE_VER-1.*.rpm .
  artifacts:
    untracked: false
    expire_in: 1 hour
    name: "$RPM_PACKAGE_NAME-$RPM_PACKAGE_VER-1.*.rpm"
    paths:
      - "$RPM_PACKAGE_NAME-$RPM_PACKAGE_VER-1.*.rpm"

package-test-redos:
  extends: .package-test-template
  tags:
    - redos
  needs:
    - job: package-redos
      artifacts: true
  variables:
    INSTALL_CMD: "dnf install -y ./string-utils-*.rpm"
    VERIFY_CMD: "rpm -q string-utils"
    LIST_FILES_CMD: "rpm -ql string-utils"

package-test-astra:
  extends: .package-test-template
  tags:
    - astra
  needs:
    - job: package-astra
      artifacts: true
  variables:
    INSTALL_CMD: "apt install -y ./string-utils-*.deb"
    VERIFY_CMD: "dpkg -s string-utils"
    LIST_FILES_CMD: "dpkg -L string-utils"

doxygen:
  stage: docs
  tags:
    - astra
  before_script:
    - apt-get update && apt-get install -y doxygen graphviz
  script:
    - doxygen Doxyfile
  artifacts:
    untracked: false
    expire_in: 7 days
    paths:
      - ./doc/html